    <script>
      document.addEventListener("DOMContentLoaded", async function () {
        const loading = document.getElementById("__bundler_loading");
        function setStatus(msg) {
          if (loading) loading.textContent = msg;
        }

        // Error sink persists across replaceWith since it's on window, not the DOM.
        window.addEventListener(
          "error",
          function (e) {
            var p = document.body || document.documentElement;
            var d =
              document.getElementById("__bundler_err") ||
              p.appendChild(document.createElement("div"));
            d.id = "__bundler_err";
            d.style.cssText =
              "position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto";
            d.textContent =
              (d.textContent ? d.textContent + String.fromCharCode(10) : "") +
              "[bundle] " +
              (e.message || e.type) +
              (e.filename
                ? " (" + e.filename.slice(0, 60) + ":" + e.lineno + ")"
                : "");
          },
          true,
        );

        try {
          const manifestEl = document.querySelector(
            'script[type="__bundler/manifest"]',
          );
          const templateEl = document.querySelector(
            'script[type="__bundler/template"]',
          );
          if (!manifestEl || !templateEl) {
            setStatus("Error: missing bundle data");
            console.error(
              "[bundler] Missing script tags — manifestEl:",
              !!manifestEl,
              "templateEl:",
              !!templateEl,
            );
            return;
          }

          const manifest = JSON.parse(manifestEl.textContent);
          let template = JSON.parse(templateEl.textContent);

          const uuids = Object.keys(manifest);
          setStatus("Unpacking " + uuids.length + " assets...");

          const blobUrls = {};
          await Promise.all(
            uuids.map(async (uuid) => {
              const entry = manifest[uuid];
              try {
                const binaryStr = atob(entry.data);
                const bytes = new Uint8Array(binaryStr.length);
                for (let i = 0; i < binaryStr.length; i++)
                  bytes[i] = binaryStr.charCodeAt(i);

                let finalBytes = bytes;
                if (entry.compressed) {
                  if (typeof DecompressionStream !== "undefined") {
                    const ds = new DecompressionStream("gzip");
                    const writer = ds.writable.getWriter();
                    const reader = ds.readable.getReader();
                    writer.write(bytes);
                    writer.close();
                    const chunks = [];
                    let totalLen = 0;
                    while (true) {
                      const { done, value } = await reader.read();
                      if (done) break;
                      chunks.push(value);
                      totalLen += value.length;
                    }
                    finalBytes = new Uint8Array(totalLen);
                    let offset = 0;
                    for (const chunk of chunks) {
                      finalBytes.set(chunk, offset);
                      offset += chunk.length;
                    }
                  } else {
                    console.warn(
                      "DecompressionStream not available, asset " +
                        uuid +
                        " may not render",
                    );
                  }
                }

                blobUrls[uuid] = URL.createObjectURL(
                  new Blob([finalBytes], { type: entry.mime }),
                );
              } catch (err) {
                console.error("Failed to decode asset " + uuid + ":", err);
                blobUrls[uuid] = URL.createObjectURL(
                  new Blob([], { type: entry.mime }),
                );
              }
            }),
          );

          const extResEl = document.querySelector(
            'script[type="__bundler/ext_resources"]',
          );
          const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
          const resourceMap = {};
          for (const entry of extResources) {
            if (blobUrls[entry.uuid])
              resourceMap[entry.id] = blobUrls[entry.uuid];
          }

          setStatus("Rendering...");
          for (const uuid of uuids)
            template = template.split(uuid).join(blobUrls[uuid]);

          // Strip integrity + crossorigin — blob URLs from a file:// document inherit
          // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
          // The manifest bytes are ours; SRI protects against CDN compromise, not this.
          template = template
            .replace(/\s+integrity="[^"]*"/gi, "")
            .replace(/\s+crossorigin="[^"]*"/gi, "");

          const resourceScript =
            "<script>window.__resources = " +
            JSON.stringify(resourceMap)
              .split("</" + "script>")
              .join("<\\/" + "script>") +
            ";</" +
            "script>";
          // Inject after <head> so the DOCTYPE stays first; prepending the script
          // would push the parser into quirks mode. DOMParser always emits a <head>
          // (synthesizing one if the source HTML omitted it) but may carry
          // attributes through, so match the full opening tag. slice() rather than
          // replace() keeps us clear of $-pattern substitution in resourceScript.
          const headOpen = template.match(/<head[^>]*>/i);
          if (headOpen) {
            const i = headOpen.index + headOpen[0].length;
            template =
              template.slice(0, i) + resourceScript + template.slice(i);
          }

          // Parse the template and swap the root element. Scripts inserted via
          // DOMParser/replaceWith are inert per spec — re-create each with
          // createElement so they execute, awaiting onload for src scripts to
          // preserve ordering (React before ReactDOM before Babel before text/babel).
          const doc = new DOMParser().parseFromString(template, "text/html");
          document.documentElement.replaceWith(doc.documentElement);
          const dead = Array.from(document.scripts);
          for (const old of dead) {
            const s = document.createElement("script");
            for (const a of old.attributes) s.setAttribute(a.name, a.value);
            s.textContent = old.textContent;
            // text/babel scripts with a src: fetch and inline. transformScriptTags
            // does XHR against the src, but blob:null/ from a file:// origin is
            // silently dropped. Inlining makes it a plain inline babel script,
            // which transformScriptTags handles unconditionally.
            if ((s.type === "text/babel" || s.type === "text/jsx") && s.src) {
              const r = await fetch(s.src);
              s.textContent = await r.text();
              s.removeAttribute("src");
            }
            const p = s.src
              ? new Promise(function (r) {
                  s.onload = s.onerror = r;
                })
              : null;
            old.replaceWith(s);
            if (p) await p;
          }
          // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
          // which fired before we swapped the document. Trigger manually if present.
          if (
            window.Babel &&
            typeof window.Babel.transformScriptTags === "function"
          ) {
            window.Babel.transformScriptTags();
          }
        } catch (err) {
          setStatus("Error unpacking: " + err.message);
          console.error("Bundle unpack error:", err);
        }
      });
    </script>

y: 'Inter Tight';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"2d9b9919-5821-4a8f-ac68-26be9da22cf6\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n\n<style>\n  /* ─────────────────────── PALETTE — light (default) ─────────────────────── */\n  :root{\n    --paper:      #f5efe6;\n    --paper-deep: #ede4d3;\n    --card:       #fbf7ef;\n    --card-elev:  #ffffff;\n    --ink:        #1a1f2e;\n    --ink-2:      #3d4456;\n    --ink-3:      #6b6f7d;\n    --ink-4:      #a09a8e;\n    --rule:       #d9cfbb;\n    --rule-2:     #e6dcc6;\n    --terra:      #b8533a;\n    --terra-deep: #8f3d2a;\n    --terra-soft: #f0d9cc;\n    --sage:       #5d7259;\n    --sage-soft:  #dde3d4;\n\n    /* signup band background (re-themed per mode) */\n    --band-bg:    #1a1f2e;\n    --band-fg:    #f5efe6;\n    --band-fg-2:  #d0c9bb;\n\n    --serif:  \"Fraunces\", \"Cormorant Garamond\", Georgia, serif;\n    --sans:   \"Inter Tight\", -apple-system, system-ui, sans-serif;\n    --arabic: \"Amiri\", \"Fraunces\", Georgia, serif;\n  }\n\n  /* ─────────────────────── PALETTE — dark ─────────────────────── */\n  [data-theme=\"dark\"]{\n    --paper:      #15171f;\n    --paper-deep: #1c1f2a;\n    --card:       #1f2330;\n    --card-elev:  #262b3a;\n    --ink:        #f1ebdc;\n    --ink-2:      #c8c1b0;\n    --ink-3:      #948e80;\n    --ink-4:      #6e6a60;\n    --rule:       #353a48;\n    --rule-2:     #2a2f3c;\n    --terra:      #d36546;\n    --terra-deep: #b8533a;\n    --terra-soft: #3a2520;\n    --sage:       #8aa284;\n    --sage-soft:  #2a3328;\n\n    --band-bg:    #0d0f15;\n    --band-fg:    #f1ebdc;\n    --band-fg-2:  #b9b3a3;\n  }\n\n  *{ box-sizing: border-box; }\n  html,body{ margin:0; padding:0; }\n  html{ scroll-behavior: smooth; }\n  body{\n    background: var(--paper);\n    color: var(--ink);\n    font-family: var(--sans);\n    font-size: 15.5px;\n    line-height: 1.55;\n    -webkit-font-smoothing: antialiased;\n    text-rendering: optimizeLegibility;\n    transition: background .25s ease, color .25s ease;\n  }\n  ::selection{ background: var(--terra); color: var(--paper); }\n  a{ color: inherit; }\n  img, svg{ display: block; }\n\n  /* ─────────────── page container (host for container queries) ─────────────── */\n  .page{\n    container-type: inline-size;\n    container-name: page;\n    width: 100%;\n    margin: 0 auto;\n    background: var(--paper);\n    transition: background .25s ease, max-width .35s cubic-bezier(.6,.0,.2,1), box-shadow .25s ease, border-radius .25s ease;\n  }\n\n  /* phone mode — clamp inline size + faux device chrome */\n  body[data-device=\"phone\"]{\n    background: #0a0b10;\n    padding: 32px 0 48px;\n  }\n  body[data-device=\"phone\"] .page{\n    max-width: 412px;\n    border-radius: 44px;\n    box-shadow:\n      0 0 0 10px #1c1d22,\n      0 0 0 12px #2a2c33,\n      0 30px 60px -20px rgba(0,0,0,.6);\n    overflow: hidden;\n  }\n  body[data-device=\"phone\"] .page::before{\n    content: \"\";\n    display: block;\n    height: 28px;\n    background: var(--paper);\n    position: relative;\n    z-index: 1;\n  }\n  body[data-device=\"phone\"] .page::after{\n    content: \"\";\n    position: absolute;\n    width: 116px; height: 30px;\n    background: #0a0b10;\n    border-radius: 999px;\n    left: 50%;\n    transform: translate(-50%, -3px);\n    z-index: 2;\n  }\n  body[data-device=\"phone\"] nav.top{ position: relative; top: auto; }\n\n  .wrap{ max-width: 1240px; margin: 0 auto; padding: 0 32px; }\n  @container page (max-width: 640px){ .wrap{ padding: 0 20px; } }\n\n  /* ─── Eyebrow ─── */\n  .eyebrow{\n    font-family: var(--sans);\n    font-size: 10px; font-weight: 600;\n    text-transform: uppercase;\n    letter-spacing: 0.22em;\n    color: var(--ink-3);\n  }\n  .eyebrow.on-terra{ color: var(--terra); }\n\n  /* ─── Buttons ─── */\n  .btn{\n    display: inline-flex; align-items: center; gap: 10px;\n    height: 46px; padding: 0 22px;\n    font: 500 13px/1 var(--sans);\n    letter-spacing: 0.04em;\n    text-transform: uppercase;\n    border-radius: 3px;\n    border: 1px solid transparent;\n    cursor: pointer;\n    text-decoration: none;\n    transition: transform .12s ease, background .15s ease, color .15s ease, border-color .15s ease;\n    white-space: nowrap;\n  }\n  .btn-primary{ background: var(--ink); color: var(--paper); }\n  .btn-primary:hover{ background: var(--terra-deep); color: var(--paper); }\n  .btn-primary:active{ transform: scale(0.98); }\n  .btn-ghost{ background: transparent; color: var(--ink); border-color: var(--rule); }\n  .btn-ghost:hover{ border-color: var(--ink); }\n  .btn .arr{ transition: transform .15s ease; }\n  .btn:hover .arr{ transform: translateX(3px); }\n\n  /* ─────────────────────────── NAV ─────────────────────────── */\n  nav.top{\n    position: sticky; top: 0; z-index: 50;\n    background: color-mix(in oklab, var(--paper) 92%, transparent);\n    backdrop-filter: saturate(140%) blur(10px);\n    -webkit-backdrop-filter: saturate(140%) blur(10px);\n    border-bottom: 1px solid transparent;\n    transition: border-color .2s ease, background .25s ease;\n  }\n  nav.top.scrolled{ border-bottom-color: var(--rule); }\n  nav.top .row{\n    display:flex; align-items: center; justify-content: space-between;\n    height: 72px;\n  }\n  .brand-mark{\n    display:flex; align-items: center; gap: 12px;\n    font-family: var(--serif);\n    font-style: italic;\n    font-weight: 500;\n    font-size: 26px;\n    letter-spacing: -0.02em;\n    color: var(--ink);\n    text-decoration: none;\n  }\n  .brand-mark .logo{ width: 32px; height: 32px; }\n  .brand-mark .logo .lg-stroke{ stroke: var(--paper); transition: stroke .2s ease; }\n  .brand-mark .logo .lg-dot{ fill: var(--paper); transition: fill .2s ease; }\n  .nav-links{ display:flex; gap: 28px; align-items: center; font-size: 13px; color: var(--ink-3); }\n  .nav-links a{ text-decoration: none; }\n  .nav-links a:hover{ color: var(--ink); }\n  @container page (max-width: 720px){ .nav-links .link{ display: none; } }\n\n  /* ─────────────────────────── HERO ─────────────────────────── */\n  .hero{\n    position: relative;\n    padding: 56px 0 88px;\n    overflow: hidden;\n  }\n  .hero-grid{\n    display:grid;\n    grid-template-columns: 1.25fr 1fr;\n    gap: 56px;\n    align-items: center;\n  }\n  @container page (max-width: 920px){\n    .hero-grid{ grid-template-columns: 1fr; gap: 40px; align-items: stretch; }\n    .hero{ padding: 24px 0 64px; }\n  }\n\n  .ribbon{\n    display:inline-flex; align-items:center; gap: 10px;\n    font-family: var(--sans);\n    font-size: 10px; font-weight: 600;\n    text-transform: uppercase;\n    letter-spacing: 0.22em;\n    color: var(--terra);\n  }\n  .ribbon .dot{\n    width: 6px; height: 6px; border-radius: 50%;\n    background: var(--terra);\n    box-shadow: 0 0 0 4px var(--terra-soft);\n  }\n\n  h1.display{\n    font-family: var(--serif);\n    font-weight: 400;\n    font-style: italic;\n    font-size: clamp(44px, 7.2cqi, 108px);\n    line-height: 0.98;\n    letter-spacing: -0.025em;\n    margin: 26px 0 0;\n    text-wrap: balance;\n    color: var(--ink);\n  }\n  h1.display .roman{ font-style: normal; font-weight: 400; }\n  h1.display .arabic{\n    display: block;\n    font-family: var(--arabic);\n    font-style: normal;\n    color: var(--terra);\n    font-size: 0.36em;\n    margin-top: 18px;\n    letter-spacing: 0;\n    line-height: 1;\n  }\n\n  .hero p.lede{\n    font-family: var(--serif);\n    font-style: italic;\n    font-weight: 400;\n    font-size: clamp(17px, 1.7cqi, 21px);\n    line-height: 1.5;\n    color: var(--ink-2);\n    max-width: 540px;\n    margin: 28px 0 0;\n    text-wrap: pretty;\n  }\n\n  .hero-rule{ margin: 28px 0 8px; }\n\n  .hero-cta{\n    display: flex; gap: 12px; flex-wrap: wrap;\n    margin-top: 28px;\n  }\n\n  .hero-meta{ inejoin=\"round\">\n      <path d=\"M10 14 H34 A4 4 0 0 1 38 18 V32 A4 4 0 0 1 34 36 H20 L12 44 V18 A4 4 0 0 1 16 14 Z\"><\u002Fpath>\n      <path d=\"M26 28 H46 A4 4 0 0 1 50 32 V46 A4 4 0 0 1 46 50 H32 L26 56 V32 A4 4 0 0 1 30 28 Z\"><\u002Fpath>\n    <\u002Fsymbol>\n    <symbol id=\"ico-circle\" viewBox=\"0 0 64 64\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n      <circle cx=\"32\" cy=\"32\" r=\"20\"><\u002Fcircle>\n      <circle cx=\"22\" cy=\"28\" r=\"4\"><\u002Fcircle>\n      <circle cx=\"42\" cy=\"28\" r=\"4\"><\u002Fcircle>\n      <circle cx=\"32\" cy=\"44\" r=\"4\"><\u002Fcircle>\n      <path d=\"M22 28 L42 28 L32 44 Z\" stroke-dasharray=\"2 2\"><\u002Fpath>\n    <\u002Fsymbol>\n  <\u002Fdefs>\n<\u002Fsvg>\n\n\n\n<main class=\"page\">\n\n<!-- ─────────────────────────── NAV ─────────────────────────── -->\n<nav class=\"top\" id=\"topnav\">\n  <div class=\"wrap row\">\n    <a class=\"brand-mark\" href=\"#top\" aria-label=\"Taaruf, home\">\n      <svg class=\"logo\" viewBox=\"0 0 600 400\" aria-hidden=\"true\">\n        <g fill=\"#b8533a\">\n          <circle cx=\"170\" cy=\"175\" r=\"125\"><\u002Fcircle>\n          <path d=\"M 92 270 L 38 360 L 138 290 Z\"><\u002Fpath>\n        <\u002Fg>\n        <g class=\"lg-stroke-g\" fill=\"none\" stroke-linejoin=\"miter\">\n          <path class=\"lg-stroke\" stroke-width=\"11\" d=\"M170,85 L196.36,111.36 L233.64,111.36 L233.64,148.64 L260,175 L233.64,201.36 L233.64,238.64 L196.36,238.64 L170,265 L143.64,238.64 L106.36,238.64 L106.36,201.36 L80,175 L106.36,148.64 L106.36,111.36 L143.64,111.36 Z\"><\u002Fpath>\n          <path class=\"lg-stroke\" stroke-width=\"5\" d=\"M170,148 L177.78,155.78 L188.79,155.78 L188.79,166.79 L196.57,174.57 L188.79,182.36 L188.79,193.36 L177.78,193.36 L170,201.14 L162.22,193.36 L151.21,193.36 L151.21,182.36 L143.43,174.57 L151.21,166.79 L151.21,155.78 L162.22,155.78 Z\"><\u002Fpath>\n        <\u002Fg>\n        <circle class=\"lg-dot\" cx=\"170\" cy=\"175\" r=\"3\"><\u002Fcircle>\n        <g fill=\"#b8533a\">\n          <circle cx=\"420\" cy=\"240\" r=\"86\"><\u002Fcircle>\n          <path d=\"M 472 304 L 512 360 L 462 320 Z\"><\u002Fpath>\n        <\u002Fg>\n        <g fill=\"none\" stroke-width=\"11\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n          <path class=\"lg-stroke\" d=\"M 390 222 A 30 30 0 1 1 420 263 L 420 282\"><\u002Fpath>\n        <\u002Fg>\n        <circle class=\"lg-dot\" cx=\"420\" cy=\"306\" r=\"6.5\"><\u002Fcircle>\n      <\u002Fsvg>\n      Taaruf\n    <\u002Fa>\n\n    <div class=\"nav-links\">\n      <a href=\"#how\" class=\"link\">How it works<\u002Fa>\n      <a href=\"#note\" class=\"link\">Our intent<\u002Fa>\n      <a href=\"#signup\" class=\"btn btn-ghost\" style=\"height:38px;padding:0 16px;font-size:11px;\">\n        Notify me\n      <\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fnav>\n\n<!-- ─────────────────────────── HERO ─────────────────────────── -->\n<header class=\"hero\" id=\"top\">\n  <div class=\"wrap hero-grid\">\n\n    <div class=\"hero-left\">\n      <div class=\"ribbon\"><span class=\"dot\"><\u002Fspan>Launching soon (Note entire website is just mock data atm and not 100% correct info about the concept.<\u002Fdiv>\n\n      <h1 class=\"display\">\n        Getting to know,<br>\n        <span class=\"roman\">with<\u002Fspan> intention.\n        <span class=\"arabic\">تَعَارُف<\u002Fspan>\n      <\u002Fh1>\n\n      <div class=\"hero-rule\">\n        <svg width=\"240\" height=\"14\" viewBox=\"0 0 240 14\" style=\"display:block;\">\n          <use href=\"#double-rule\"><\u002Fuse>\n        <\u002Fsvg>\n      <\u002Fdiv>\n\n      <p class=\"lede\">\n        A calm, private space for Muslims considering marriage —\n        a guided conversation between two souls, with the dignity\n        of really knowing someone before you decide.\n      <\u002Fp>\n\n      <div class=\"hero-cta\">\n        <a class=\"btn btn-primary\" href=\"#signup\">\n          Get started\n          <svg class=\"arr\" width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 12h14\"><\u002Fpath><path d=\"m13 5 7 7-7 7\"><\u002Fpath><\u002Fsvg>\n        <\u002Fa>\n        <a class=\"btn btn-ghost\" href=\"#how\">See how it works<\u002Fa>\n      <\u002Fdiv>\n\n      <div class=\"hero-meta\">\n        <div class=\"item\">\n          <div class=\"k\">Private<\u002Fdiv>\n          <div class=\"v\">End-to-end. You decide who sees what.<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"item\">\n          <div class=\"k\">Mahram-friendly<\u002Fdiv>\n          <div class=\"v\">Bring a wali into the conversation.<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"item\">\n          <div class=\"k\">Real intent<\u002Fdiv>\n          <div class=\"v\">Built for marriage, not for matching.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <aside class=\"hero-card\" aria-label=\"Quote and principles\">\n      <svg class=\"corner tl\"><use href=\"#corner\"><\u002Fuse><\u002Fsvg>\n      <svg class=\"corner tr\"><use href=\"#corner\"><\u002Fuse><\u002Fsvg>\n      <svg class=\"corner bl\"><use href=\"#corner\"><\u002Fuse><\u002Fsvg>\n      <svg class=\"corner br\"><use href=\"#corner\"><\u002Fuse><\u002Fsvg>\n\n      <div class=\"card-eyebrow eyebrow\">Qur'ān · 49:13<\u002Fdiv>\n\n      <div class=\"arabic-verse\">لِتَعَارَفُوا<\u002Fdiv>\n\n      <blockquote class=\"quote\">\n        “…that you may come<br>to know one another.”\n      <\u002Fblockquote>\n      <div class=\"cite\">Sūrat al-Ḥujurāt<\u002Fdiv>\n\n      <div class=\"divider-row\">\n        <svg width=\"200\" height=\"14\" viewBox=\"0 0 240 14\"><use href=\"#double-rule\"><\u002Fuse><\u002Fsvg>\n      <\u002Fdiv>\n\n      <div class=\"principles\">\n        <div class=\"principle\"><span class=\"num\">i.<\u002Fspan><div class=\"body\"><b>Begin with intention.<\u002Fb>State why you're here, in your own words.<\u002Fdiv><\u002Fdiv>\n        <div class=\"principle\"><span class=\"num\">ii.<\u002Fspan><div class=\"body\"><b>Speak before you swipe.<\u002Fb>Questions first; photos when you're ready.<\u002Fdiv><\u002Fdiv>\n        <div class=\"principle\"><span class=\"num\">iii.<\u002Fspan><div class=\"body\"><b>End with clarity.<\u002Fb>Yes, no, or not yet — without ghosting.<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Faside>\n\n  <\u002Fdiv>\n<\u002Fheader>\n\n<!-- ─────────────────────────── star marquee ─────────────────────────── -->\n<div class=\"star-strip\" aria-hidden=\"true\">\n  <div class=\"marquee\">\n    <span>\n      knowing <svg class=\"tile\" width=\"13\" height=\"13\"><use href=\"#tile\"><\u002Fuse><\u002Fsvg>\n      intention <svg class=\"tile\" width=\"13\" height=\"13\"><use href=\"#tile\"><\u002Fuse><\u002Fsvg>\n      dignity <svg class=\"tile\" width=\"13\" height=\"13\"><use href=\"#tile\"><\u002Fuse><\u002Fsvg>\n      modesty <svg class=\"tile\" width=\"13\" height=\"13\"><use href=\"#tile\"><\u002Fuse><\u002Fsvg>\n      clarity <svg class=\"tile\" width=\"13\" height=\"13\"><use href=\"#tile\"><\u002Fuse><\u002Fsvg>\n      trust <svg class=\"tile\" width=\"13\" height=\"13\"><use href=\"#tile\"><\u002Fuse><\u002Fsvg>\n      stillness <svg class=\"tile\" width=\"13\" height=\"13\"><use href=\"#tile\"><\u002Fuse><\u002Fsvg>\n    <\u002Fspan>\n    <span>\n      knowing <svg class=\"tile\" width=\"13\" height=\"13\"><use href=\"#tile\"><\u002Fuse><\u002Fsvg>\n      intention <svg class=\"tile\" width=\"13\" height=\"13\"><use href=\"#tile\"><\u002Fuse><\u002Fsvg>\n      dignity <svg class=\"tile\" width=\"13\" height=\"13\"><use href=\"#tile\"><\u002Fuse><\u002Fsvg>\n      modesty <svg class=\"tile\" width=\"13\" height=\"13\"><use href=\"#tile\"><\u002Fuse><\u002Fsvg>\n      clarity <svg class=\"tile\" width=\"13\" height=\"13\"><use href=\"#tile\"><\u002Fuse><\u002Fsvg>\n      trust <svg class=\"tile\" width=\"13\" height=\"13\"><use href=\"#tile\"><\u002Fuse><\u002Fsvg>\n      stillness <svg class=\"tile\" width=\"13\" height=\"13\"><use href=\"#tile\"><\u002Fuse><\u002Fsvg>\n    <\u002Fspan>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ─────────────────────────── HOW IT WORKS ─────────────────────────── -->\n<section class=\"block\" id=\"how\">\n  <div class=\"wrap\">\n    <div class=\"section-head\">\n      <div>\n        <div class=\"eyebrow on-terra\">How it works<\u002Fdiv>\n        <h2 class=\"section-title\">Three quiet steps,<br><span class=\"roman\">no<\u002Fspan> rush.<\u002Fh2>\n        <div class=\"section-rule\">\n          <svg width=\"200\" height=\"14\" viewBox=\"0 0 240 14\"><use href=\"#double-rule\"><\u002Fuse><\u002Fsvg>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <p class=\"section-sub\">\n        Taaruf moves at the pace of getting to know someone — not the pace of an app.\n        Each step opens only when you're ready for it.\n      <\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"steps\">\n      <article class=\"step\">\n        <div class=\"index\">Step i<\u002Fdiv>\n        <div class=\"icon-wrap\">\n          <svg width=\"44\" height=\"44\" viewBox=\"0 0 64 64\" style=\"color:var(--terra)\"><use href=\"#ico-quill\"><\u002Fuse><\u002Fsvg>\n        <\u002Fdiv>\n        <h3>Write your intention<\u002Fh3>\n        <p>Tell us — in your own words — what you're looking for. Faith, family, the life you hope to build. No checkboxes.<\u002Fp>\n      <\u002Farticle>\n\n      <article class=\"step\">\n        <div class=\"index\">Step ii<\u002Fdiv>\n        <div class=\"icon-wrap\">\n          <svg width=\"44\" height=\"44\" viewBox=\"0 0 64 64\" style=\"color:var(--terra)\"><use href=\"#ico-bubbles\"><\u002Fuse><\u002Fsvg>\n        <\u002Fdiv>\n        <h3>Exchange real questions<\u002Fh3>\n        <p>Guided prompts and free conversation — text or scheduled voice. Photos and details unlock when you both agree.<\u002Fp>\n      <\u002Farticle>\n\n      <article class=\"step\">\n        <div class=\"index\">Step iii<\u002Fdiv>\n        <div class=\"icon-wrap\">\n          <svg width=\"44\" height=\"44\" viewBox=\"0 0 64 64\" style=\"color:var(--terra)\"><use href=\"#ico-circle\"><\u002Fuse><\u002Fsvg>\n        <\u002Fdiv>\n        <h3>Bring in your people<\u002Fh3>\n        <p>When it feels right, invite a wali or a parent into a shared view. Move toward a meeting, with everyone aligned.<\u002Fp>\n      <\u002Farticle>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ─────────────────────────── EMAIL SIGNUP ─────────────────────────── -->\n<section class=\"signup-wrap\" id=\"signup\">\n  <div class=\"wrap block signup\">\n    <div>\n      <div class=\"kicker\">Be the first to know<\u002Fdiv>\n      <h2>Tell me when<br>Taaruf <span class=\"roman\">launches.<\u002Fspan><\u002Fh2>\n      <div class=\"signup-rule\">\n        <svg width=\"200\" height=\"14\" viewBox=\"0 0 240 14\">\n          <line x1=\"0\" y1=\"4\" x2=\"112\" y2=\"4\" stroke=\"currentColor\" stroke-width=\"0.7\" opacity=\"0.35\"><\u002Fline>\n          <line x1=\"128\" y1=\"4\" x2=\"240\" y2=\"4\" stroke=\"currentColor\" stroke-width=\"0.7\" opacity=\"0.35\"><\u002Fline>\n          <line x1=\"0\" y1=\"10\" x2=\"112\" y2=\"10\" stroke=\"currentColor\" stroke-width=\"0.4\" opacity=\"0.35\"><\u002Fline>\n          <line x1=\"128\" y1=\"10\" x2=\"240\" y2=\"10\" stroke=\"currentColor\" stroke-width=\"0.4\" opacity=\"0.35\"><\u002Fline>\n          <g transform=\"translate(120 7)\">\n            <rect x=\"-4\" y=\"-4\" width=\"8\" height=\"8\" fill=\"none\" stroke=\"var(--terra)\" stroke-width=\"0.8\" transform=\"rotate(45)\"><\u002Frect>\n          <\u002Fg>\n        <\u002Fsvg>\n      <\u002Fdiv>\n      <p class=\"lede\">\n        We'll write the day Taaruf opens — one email, nothing more.\n        No spam, no marketing list rentals, ever.\n      <\u002Fp>\n\n      <div class=\"stats-row\">\n        <div><b>4,200+<\u002Fb>on the waitlist<\u002Fdiv>\n        <div><b>0<\u002Fb>ads, forever<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"form-card\" id=\"formcard\">\n      <svg class=\"card-corner tl\"><use href=\"#corner\"><\u002Fuse><\u002Fsvg>\n      <svg class=\"card-corner tr\"><use href=\"#corner\"><\u002Fuse><\u002Fsvg>\n      <svg class=\"card-corner bl\"><use href=\"#corner\"><\u002Fuse><\u002Fsvg>\n      <svg class=\"card-corner br\"><use href=\"#corner\"><\u002Fuse><\u002Fsvg>\n\n      <div class=\"crest\">\n        <svg width=\"28\" height=\"28\" style=\"margin:0 auto; color:var(--terra)\"><use href=\"#tile\"><\u002Fuse><\u002Fsvg>\n        <div class=\"label\">Waitlist<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"title\">Tell us where to write.<\u002Fdiv>\n\n      <form id=\"waitlistForm\" novalidate=\"\">\n        <label for=\"email\">Email address<\u002Flabel>\n        <div class=\"field\" id=\"emailField\">\n          <input type=\"email\" id=\"email\" name=\"email\" placeholder=\"your@email.com\" autocomplete=\"email\" required=\"\">\n          <button type=\"submit\" class=\"submit\">Notify me<\u002Fbutton>\n        <\u002Fdiv>\n\n        <p class=\"helper\">\n          <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"11\" width=\"18\" height=\"11\" rx=\"2\"><\u002Frect><path d=\"M7 11V7a5 5 0 0 1 10 0v4\"><\u002Fpath><\u002Fsvg>\n          One email at launch. Nothing else.\n        <\u002Fp>\n      <\u002Fform>\n\n      <div class=\"audience-pills\" role=\"group\" aria-label=\"I'm here as\">\n        <span class=\"pill-label\">I'm here as<\u002Fspan>\n        <button type=\"button\" class=\"pill\" data-pill=\"self\">myself<\u002Fbutton>\n        <button type=\"button\" class=\"pill\" data-pill=\"parent\">a parent<\u002Fbutton>\n        <button type=\"button\" class=\"pill\" data-pill=\"wali\">a wali<\u002Fbutton>\n        <button type=\"button\" class=\"pill\" data-pill=\"curious\">just curious<\u002Fbutton>\n      <\u002Fdiv>\n\n      <div class=\"success-msg\" role=\"status\">\n        <div class=\"check\">\n          <svg width=\"32\" height=\"32\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"20 6 9 17 4 12\"><\u002Fpolyline><\u002Fsvg>\n        <\u002Fdiv>\n        <h4>You're on the list.<\u002Fh4>\n        <p>We'll write the day Taaruf launches.<\u002Fp>\n        <div class=\"arabic\">بَارَكَ اللهُ فِيكَ<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ─────────────────────────── FOUNDER NOTE ─────────────────────────── -->\n<section class=\"note\" id=\"note\">\n  <div class=\"wrap note-grid\">\n    <div>\n      <div class=\"label\">A note from the founder<\u002Fdiv>\n      <div class=\"from\">\n        Saleem\n        <span class=\"sub\">Founder<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div>\n      <p>\n        I built Taaruf because the apps I tried treated marriage like a game and our\n        community like a market. Profiles felt like résumés, conversations\n        like interviews, and somewhere in the rush of swipes, <em>the actual\n        person<\u002Fem> — the one I was supposed to be getting to know — disappeared.\n      <\u002Fp>\n      <p>\n        So I started over. I asked imams, counsellors, and dozens of married\n        couples what they wished had existed when they were looking. I listened\n        to single Muslims who were tired, but not jaded. And I built the slow,\n        quiet, deliberate platform I wished I'd had.\n      <\u002Fp>\n      <p>\n        Taaruf is what came of that. I hope, in'shā'Allāh, it helps.\n      <\u002Fp>\n      <div class=\"signoff\">إن شاء الله<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ─────────────────────────── FOOTER ─────────────────────────── -->\n<footer class=\"foot\">\n  <div class=\"wrap\">\n    <div class=\"foot-grid\">\n      <div>\n        <a class=\"brand-mark\" href=\"#top\" aria-label=\"Taaruf\">\n          <svg class=\"logo\" viewBox=\"0 0 600 400\" aria-hidden=\"true\">\n            <g fill=\"#b8533a\">\n              <circle cx=\"170\" cy=\"175\" r=\"125\"><\u002Fcircle>\n              <path d=\"M 92 270 L 38 360 L 138 290 Z\"><\u002Fpath>\n            <\u002Fg>\n            <g fill=\"none\" stroke-linejoin=\"miter\">\n              <path class=\"lg-stroke\" stroke-width=\"11\" d=\"M170,85 L196.36,111.36 L233.64,111.36 L233.64,148.64 L260,175 L233.64,201.36 L233.64,238.64 L196.36,238.64 L170,265 L143.64,238.64 L106.36,238.64 L106.36,201.36 L80,175 L106.36,148.64 L106.36,111.36 L143.64,111.36 Z\"><\u002Fpath>\n              <path class=\"lg-stroke\" stroke-width=\"5\" d=\"M170,148 L177.78,155.78 L188.79,155.78 L188.79,166.79 L196.57,174.57 L188.79,182.36 L188.79,193.36 L177.78,193.36 L170,201.14 L162.22,193.36 L151.21,193.36 L151.21,182.36 L143.43,174.57 L151.21,166.79 L151.21,155.78 L162.22,155.78 Z\"><\u002Fpath>\n            <\u002Fg>\n            <circle class=\"lg-dot\" cx=\"170\" cy=\"175\" r=\"3\"><\u002Fcircle>\n            <g fill=\"#b8533a\">\n              <circle cx=\"420\" cy=\"240\" r=\"86\"><\u002Fcircle>\n              <path d=\"M 472 304 L 512 360 L 462 320 Z\"><\u002Fpath>\n            <\u002Fg>\n            <g fill=\"none\" stroke-width=\"11\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n              <path class=\"lg-stroke\" d=\"M 390 222 A 30 30 0 1 1 420 263 L 420 282\"><\u002Fpath>\n            <\u002Fg>\n            <circle class=\"lg-dot\" cx=\"420\" cy=\"306\" r=\"6.5\"><\u002Fcircle>\n          <\u002Fsvg>\n          Taaruf\n        <\u002Fa>\n        <p class=\"blurb\">A guided conversation between two souls considering marriage — built around the practice of ta'āruf.<\u002Fp>\n      <\u002Fdiv>\n\n      <div>\n        <h5>Product<\u002Fh5>\n        <ul>\n          <li><a href=\"#how\">How it works<\u002Fa><\u002Fli>\n          <li><a href=\"#signup\">Join waitlist<\u002Fa><\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div>\n        <h5>Company<\u002Fh5>\n        <ul>\n          <li><a href=\"#note\">Our intent<\u002Fa><\u002Fli>\n          <li><a href=\"#\">Scholars &amp; advisors<\u002Fa><\u002Fli>\n          <li><a href=\"#\">Press kit<\u002Fa><\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div>\n        <h5>Reach us<\u002Fh5>\n        <ul>\n          <li><a href=\"mailto:salaam@taaruf.app\">salaam@taaruf.app<\u002Fa><\u002Fli>\n          <li><a href=\"#\">Instagram<\u002Fa><\u002Fli>\n          <li><a href=\"#\">Privacy &amp; data<\u002Fa><\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"foot-bottom\">\n      <div>© 2026 Taaruf — all rights reserved.<\u002Fdiv>\n      <div class=\"arabic\">بِسْمِ اللهِ<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Ffooter>\n\n<\u002Fmain>\n\n<!-- ─────────────────────────── TWEAKS PANEL ─────────────────────────── -->\n<div id=\"tweaks\" aria-hidden=\"true\">\n  <div class=\"head\">\n    <svg width=\"14\" height=\"14\" style=\"color:var(--terra)\"><use href=\"#tile\"><\u002Fuse><\u002Fsvg>\n    Tweaks\n  <\u002Fdiv>\n  <div class=\"grp\">\n    <div class=\"lbl\">Theme<\u002Fdiv>\n    <div class=\"seg\" data-key=\"theme\">\n      <button data-val=\"light\">Light<\u002Fbutton>\n      <button data-val=\"dark\">Dark<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"grp\">\n    <div class=\"lbl\">Device<\u002Fdiv>\n    <div class=\"seg\" data-key=\"device\">\n      <button data-val=\"desktop\">Desktop<\u002Fbutton>\n      <button data-val=\"phone\">Phone<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"hint\">Theme &amp; device toggles preview the landing in different shells.<\u002Fdiv>\n<\u002Fdiv>\n\n<script>\n  // ─── sticky nav ──────────────────────────────────────────────\n  const nav = document.getElementById('topnav');\n  const onScroll = () => nav.classList.toggle('scrolled', window.scrollY > 8);\n  document.addEventListener('scroll', onScroll, { passive: true });\n  onScroll();\n\n  // ─── audience pills (single-select) ──────────────────────────\n  document.querySelectorAll('.pill').forEach(p => {\n    p.addEventListener('click', () => {\n      document.querySelectorAll('.pill').forEach(x => x !== p && x.classList.remove('on'));\n      p.classList.toggle('on');\n    });\n  });\n\n  // ─── waitlist form ───────────────────────────────────────────\n  const form = document.getElementById('waitlistForm');\n  const card = document.getElementById('formcard');\n  const field = document.getElementById('emailField');\n  form.addEventListener('submit', (e) => {\n    e.preventDefault();\n    const email = form.email.value.trim();\n    if (!email || !/.+@.+\\..+/.test(email)) {\n      field.classList.add('error');\n      form.email.focus();\n      return;\n    }\n    field.classList.remove('error');\n    card.classList.add('success');\n  });\n  form.email.addEventListener('input', () => field.classList.remove('error'));\n\n  // ─── tweaks ──────────────────────────────────────────────────\n  const TWEAKS = /*EDITMODE-BEGIN*/{\n    \"theme\": \"dark\",\n    \"device\": \"phone\"\n  }/*EDITMODE-END*/;\n\n  const panel = document.getElementById('tweaks');\n\n  function applyTweaks(){\n    document.documentElement.dataset.theme = TWEAKS.theme;\n    document.body.dataset.device = TWEAKS.device;\n    panel.querySelectorAll('.seg').forEach(seg => {\n      const key = seg.dataset.key;\n      seg.querySelectorAll('button').forEach(b => {\n        b.classList.toggle('on', b.dataset.val === TWEAKS[key]);\n      });\n    });\n  }\n  applyTweaks();\n\n  panel.querySelectorAll('.seg button').forEach(b => {\n    b.addEventListener('click', () => {\n      const key = b.parentElement.dataset.key;\n      const val = b.dataset.val;\n      TWEAKS[key] = val;\n      applyTweaks();\n      try {\n        window.parent.postMessage({\n          type: '__edit_mode_set_keys',\n          edits: { [key]: val }\n        }, '*');\n      } catch(e){}\n    });\n  });\n\n  // ─── edit-mode protocol ──────────────────────────────────────\n  window.addEventListener('message', (e) => {\n    if (!e.data || !e.data.type) return;\n    if (e.data.type === '__activate_edit_mode')   panel.classList.add('on');\n    if (e.data.type === '__deactivate_edit_mode') panel.classList.remove('on');\n  });\n  try { window.parent.postMessage({ type: '__edit_mode_available' }, '*'); } catch(e){}\n<\u002Fscript>\n\n\n\n<\u002Fbody><\u002Fhtml>"
    </script>
